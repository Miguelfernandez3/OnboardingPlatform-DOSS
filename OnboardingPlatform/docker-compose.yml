name: onboarding-platform

services:
  fake-feam:
    build:
      context: .
      dockerfile: Fake-FEAM/Dockerfile
    ports:
      - "8185:8181"
    restart: unless-stopped
    networks:
      - onboarding-net

  mud-manager:
    build:
      context: .
      dockerfile: Extended-MUD-Manager/Dockerfile
    env_file:
      - .env.compose
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOCALHOST_ALIAS_BY_PORT: "${LOCALHOST_ALIAS_BY_PORT:-8091:mud-server,8888:mud-manager,8889:threat-mud-manager,4321:domain-manager,3001:gui}"
      MUD_MANAGER_REQUIRE_AUTH: ${MUD_MANAGER_REQUIRE_AUTH:-false}
      MUD_LOCALHOST_ALIAS: ${MUD_LOCALHOST_ALIAS:-mud-server}
    ports:
      - "8888:8888"
    restart: unless-stopped
    networks:
      - onboarding-net

  threat-mud-manager:
    build:
      context: .
      dockerfile: Extended-MUD-Manager/Dockerfile
    command: ["python", "ThreatMUDManager.py"]
    env_file:
      - .env.compose
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      LOCALHOST_ALIAS_BY_PORT: "${LOCALHOST_ALIAS_BY_PORT:-8091:mud-server,8888:mud-manager,8889:threat-mud-manager,4321:domain-manager,3001:gui}"
      THREAT_MUD_MANAGER_REQUIRE_AUTH: ${THREAT_MUD_MANAGER_REQUIRE_AUTH:-false}
      THREAT_MUD_LOCALHOST_ALIAS: ${THREAT_MUD_LOCALHOST_ALIAS:-mud-server}
    ports:
      - "8889:8889"
    restart: unless-stopped
    networks:
      - onboarding-net

  mud-server:
    build:
      context: .
      dockerfile: Extended-MUD-Server/Dockerfile
    env_file:
      - .env.compose
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      MUD_SERVER_REQUIRE_AUTH: ${MUD_SERVER_REQUIRE_AUTH:-false}
    ports:
      - "80:8091"
    restart: unless-stopped
    networks:
      - onboarding-net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - onboarding-net

  domain-manager:
    build:
      context: .
      dockerfile: Domain-Manager/Dockerfile
    depends_on:
      fake-feam:
        condition: service_started
      mud-manager:
        condition: service_started
      threat-mud-manager:
        condition: service_started
      mud-server:
        condition: service_started
      redis:
        condition: service_started
    env_file:
      - .env.compose
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      FEAM_SERVER_URL: ${FEAM_SERVER_URL:-http://fake-feam:8181}
      MUD_MANAGER_URL: http://mud-manager:8888
      THREAT_MUD_MANAGER_URL: http://threat-mud-manager:8889
      DADM_DATABASE_PATH: ${DADM_DATABASE_PATH:-/var/lib/onboardingplatform/domain-manager/DeviceDomainManager.db}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4321:4321"
    volumes:
      - domain-manager-data:/var/lib/onboardingplatform/domain-manager
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - onboarding-net

  domain-manager-notification-worker:
    build:
      context: .
      dockerfile: Domain-Manager/Dockerfile
    depends_on:
      redis:
        condition: service_started
      domain-manager:
        condition: service_started
    env_file:
      - .env.compose
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      DADM_DATABASE_PATH: ${DADM_DATABASE_PATH:-/var/lib/onboardingplatform/domain-manager/DeviceDomainManager.db}
      REDIS_URL: redis://redis:6379/0
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-true}
      TELEGRAM_NOTIFICATIONS_ENABLED: ${TELEGRAM_NOTIFICATIONS_ENABLED:-true}
      # RQ imports jobs as services.*; ensure Domain-Manager root is on path when not using app.py cwd
      PYTHONPATH: /opt/onboardingplatform/Domain-Manager
    volumes:
      - domain-manager-data:/var/lib/onboardingplatform/domain-manager
    command: ["python", "scripts/run_notification_worker.py"]
    restart: unless-stopped
    networks:
      - onboarding-net

  gui:
    build:
      context: ../GUI
      dockerfile: Dockerfile
      args:
        VITE_API_ADAPTER: ${GUI_VITE_API_ADAPTER:-doss}
        VITE_API_BASE_URL: ${GUI_VITE_API_BASE_URL:-/api}
        VITE_ENV: ${GUI_VITE_ENV:-production}
    depends_on:
      domain-manager:
        condition: service_started
    ports:
      - "3001:3001"
    restart: unless-stopped
    networks:
      - onboarding-net

networks:
  onboarding-net:
    driver: bridge

volumes:
  domain-manager-data:
